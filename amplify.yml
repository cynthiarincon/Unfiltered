version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
applications:
  - appRoot: /
    type: nodejs
    phases:
      preBuild:
        commands:
          - npm ci
      build:
        commands:
          - echo "No build needed"
    buildSpec:
      artifacts:
        baseDirectory: /
        files:
          - "**/*"
    platform: nodejs
    framework: express
